        - {$ref: '#/components/parameters/MaxOpeningBalance'}
        - {$ref: '#/components/parameters/MinCurrentBalance'}
        - {$ref: '#/components/parameters/MaxCurrentBalance'}
      responses:
        '200': {$ref: '#/components/responses/Collection'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/InvalidFilter'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /accounts/{id}:
    get:
      operationId: getAccount
      summary: Get one account
      parameters:
        - {$ref: '#/components/parameters/RecordId'}
      responses:
        '200': {$ref: '#/components/responses/SingleRecord'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /keys:
    get:
      operationId: listIntegrationKeys
      summary: List API key metadata
      description: Requires an administrator/developer MamePilot session bearer token, not an integration key.
      security:
        - BearerToken: []
      responses:
        '200': {$ref: '#/components/responses/KeyList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: createIntegrationKey
      summary: Create an API key
      description: Requires an administrator/developer MamePilot session bearer token. The generated secret is returned only in this response.
      security:
        - BearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label, scopes]
              properties:
                label: {type: string, minLength: 1, maxLength: 100}
                scopes:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items:
                    type: string
                    enum: [orders.read, customers.read, transactions.read, bills.read, vendors.read, accounts.read, accounts.read_balance, products.read, orders.create, orders.update, orders.delete, customers.create, customers.update, customers.delete, bills.create, bills.update, bills.delete, vendors.create, vendors.update, vendors.delete, products.create, products.update, products.delete]
                expires_at:
                  type: [string, 'null']
                  format: date-time
      responses:
        '201': {$ref: '#/components/responses/KeyCreated'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/InvalidFilter'}
  /keys/{id}:
    delete:
      operationId: revokeIntegrationKey
      summary: Revoke an API key
      description: Requires an administrator/developer MamePilot session bearer token.
      security:
        - BearerToken: []
      parameters:
        - {$ref: '#/components/parameters/RecordId'}
      responses:
        '200':
          description: Key revoked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string}
                  revoked: {type: boolean, const: true}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
components:
  securitySchemes:
    BearerToken:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Integration key for data routes; existing MamePilot admin/developer session JWT for /keys routes.
