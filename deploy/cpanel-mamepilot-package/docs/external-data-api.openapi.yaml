        '200': {$ref: '#/components/responses/Collection'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/InvalidFilter'}
        '429': {$ref: '#/components/responses/RateLimited'}
    post:
      operationId: createCustomer
      summary: Create a customer
      description: Requires customers.create and the issuer's current MamePilot customers.create permission. Only name, phone, and address are accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ContactCreate'}
      responses:
        '201': {$ref: '#/components/responses/MutationResult'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/InvalidWrite'}
        '429': {$ref: '#/components/responses/RateLimited'}
