  responses:
    Collection:
      description: Paginated resource data.
      content:
        application/json:
          schema:
            type: object
            required: [data, pagination]
            properties:
              data: {type: array, items: {$ref: '#/components/schemas/ExternalRecord'}}
              pagination: {$ref: '#/components/schemas/Pagination'}
    SingleRecord:
      description: One resource record.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: {$ref: '#/components/schemas/ExternalRecord'}
    MutationResult:
      description: Created or updated record identifier. Fetch the record separately if a read scope is available.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: object
                required: [id]
                properties:
                  id: {type: string}
    MutationDeleted:
      description: Soft-delete confirmation.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: object
                required: [id, deleted]
                properties:
                  id: {type: string}
                  deleted: {type: boolean, const: true}
    KeyList:
      description: API key metadata. Secrets and hashes are never returned.
      content:
        application/json:
          schema:
            type: object
            properties:
              data: {type: array, items: {$ref: '#/components/schemas/ApiKeyMetadata'}}
    KeyCreated:
      description: New key. api_key is shown only in this response.
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/ApiKeyMetadata'}
              - type: object
                required: [api_key]
                properties:
                  api_key: {type: string, writeOnly: true}
    Unauthorized:
      description: Missing, invalid, expired, or inactive credential.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    Forbidden:
      description: Missing resource scope, MamePilot permission, or capability.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    NotFound:
      description: Resource or record not found.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    InvalidFilter:
      description: Invalid or unsupported filter, range, enum, or request body.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    InvalidWrite:
      description: Invalid write body or rejected business operation.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    Conflict:
      description: A conflicting record already exists.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    RateLimited:
      description: More than 120 requests per minute for this key.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
