openapi: 3.1.0
info:
  title: MamePilot External Data API
  version: 1.0.0
  description: Scoped integration API. Orders, customers, bills, vendors, and products support scoped writes; transactions and accounts are read-only.
servers:
  - url: https://YOUR-DOMAIN/api/v1
    description: Production API
security:
  - BearerToken: []
paths:
  /orders:
    get:
      operationId: listOrders
      summary: List filtered orders
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
        - {$ref: '#/components/parameters/Ids'}
        - {$ref: '#/components/parameters/Search'}
        - {$ref: '#/components/parameters/CreatedFrom'}
        - {$ref: '#/components/parameters/CreatedTo'}
        - {$ref: '#/components/parameters/UpdatedFrom'}
        - {$ref: '#/components/parameters/UpdatedTo'}
        - {$ref: '#/components/parameters/UpdatedSince'}
        - {$ref: '#/components/parameters/IncludeDeleted'}
        - {$ref: '#/components/parameters/SortOrders'}
        - {$ref: '#/components/parameters/SortDirection'}
        - {$ref: '#/components/parameters/OrderStatus'}
        - {$ref: '#/components/parameters/OrderStatusNot'}
        - {$ref: '#/components/parameters/DeliveryStatus'}
        - {$ref: '#/components/parameters/OrderPaymentStatus'}
        - {$ref: '#/components/parameters/CustomerId'}
        - {$ref: '#/components/parameters/CustomerIds'}
        - {$ref: '#/components/parameters/CustomerPhone'}
        - {$ref: '#/components/parameters/OrderNumber'}
        - {$ref: '#/components/parameters/CreatedById'}
        - {$ref: '#/components/parameters/CreatedByIds'}
        - {$ref: '#/components/parameters/SourceAd'}
        - {$ref: '#/components/parameters/Courier'}
        - {$ref: '#/components/parameters/IsPos'}
        - {$ref: '#/components/parameters/PageId'}
        - {$ref: '#/components/parameters/MinAmount'}
        - {$ref: '#/components/parameters/MaxAmount'}
        - {$ref: '#/components/parameters/MinPaid'}
        - {$ref: '#/components/parameters/MaxPaid'}
        - {$ref: '#/components/parameters/MinDue'}
        - {$ref: '#/components/parameters/MaxDue'}
        - {$ref: '#/components/parameters/OrderDateFrom'}
        - {$ref: '#/components/parameters/OrderDateTo'}
        - {$ref: '#/components/parameters/OrderStatusEvent'}
        - {$ref: '#/components/parameters/StatusChangedFrom'}
        - {$ref: '#/components/parameters/StatusChangedTo'}
        - {$ref: '#/components/parameters/ProductId'}
        - {$ref: '#/components/parameters/ProductIds'}
      responses:
        '200': {$ref: '#/components/responses/Collection'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/InvalidFilter'}
        '429': {$ref: '#/components/responses/RateLimited'}
    post:
      operationId: createOrder
      summary: Create an order
      description: Requires orders.create and the issuer's current MamePilot orders.create permission. New orders start On Hold.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OrderCreate'}
      responses:
        '201': {$ref: '#/components/responses/MutationResult'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/InvalidWrite'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /orders/{id}:
    get:
      operationId: getOrder
      summary: Get one order
      parameters:
        - {$ref: '#/components/parameters/RecordId'}
        - {$ref: '#/components/parameters/IncludeDeleted'}
      responses:
        '200': {$ref: '#/components/responses/SingleRecord'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      operationId: updateOrder
      summary: Partially update an order
      description: Requires orders.update. Existing order ownership, lifecycle, payment, stock, and feature permissions remain enforced; inaccessible records return 404.
      parameters:
        - {$ref: '#/components/parameters/RecordId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OrderUpdate'}
      responses:
        '200': {$ref: '#/components/responses/MutationResult'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/InvalidWrite'}
        '429': {$ref: '#/components/responses/RateLimited'}
    delete:
      operationId: deleteOrder
      summary: Soft-delete an order
      description: Requires orders.delete. Existing ownership checks and linked transaction/stock handling remain enforced; inaccessible records return 404.
      parameters:
        - {$ref: '#/components/parameters/RecordId'}
      responses:
        '200': {$ref: '#/components/responses/MutationDeleted'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
